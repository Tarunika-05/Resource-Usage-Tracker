<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Monitoring Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <i class="fa fa-cogs"></i>
        <span>System Monitoring Dashboard</span>
    </header>

    <div class="container">
        <h2>System Information</h2>
        <div class="info-box" id="system-info">
            <!-- System info will be populated here dynamically -->
        </div>

        <h2>Resource Usage</h2>
        <div class="info-box" id="resource-usage">
            <!-- Resource usage info will be populated here dynamically -->
        </div>

        <h2>Disk Usage</h2>
        <div class="info-box" id="disk-usage">
            <!-- Disk usage info will be populated here dynamically -->
        </div>

        <h2>Status</h2>
        <div class="status-box">
            <p id="status-message">Loading...</p>

        </div>

<script>
// Function to fetch system info
function fetchData() {
    fetch('/api/system_info')
        .then(response => response.json())
        .then(data => {
            if (data.error) {
                document.getElementById('status-message').innerText = 'Error loading system information: ' + data.error;
            } else {
                // System information section
                document.getElementById('system-info').innerHTML = `
                    <p><strong>Hostname:</strong> ${data.hostname}</p>
                    <p><strong>IP Address:</strong> ${data.ip_address}</p>
                    <p><strong>Uptime:</strong> ${data.uptime}</p>
                    <p><strong>Operating System:</strong> ${data.os_info}</p>
                    <p><strong>Kernel Version:</strong> ${data.kernel_version}</p>
                    <p><strong>Processor:</strong> ${data.processor}</p>
                    <p><strong>CPU Cores:</strong> ${data.cpu_cores}</p>
                    <p><strong>Total RAM:</strong> ${data.total_ram}</p>
                `;

                // Resource usage section
                document.getElementById('resource-usage').innerHTML = `
                    <p><strong>CPU Usage:</strong> ${data.cpu_usage}</p>
                    <p><strong>Memory Usage:</strong> ${data.memory_usage}</p>
                `;

                // Disk usage section
                document.getElementById('disk-usage').innerHTML = `
                    <p><strong>User:</strong> ${data.disk_usage.user}</p>
                    <p><strong>System:</strong> ${data.disk_usage.system}</p>
                    <p><strong>Iowait:</strong> ${data.disk_usage.iowait}</p>
                    <p><strong>Idle:</strong> ${data.disk_usage.idle}</p>
                `;

                // Status message
                document.getElementById('status-message').innerText = 'System information loaded successfully.';
            }
        })
        .catch(error => {
            document.getElementById('status-message').innerText = 'Error fetching data: ' + error;
        });
}

// Fetch data every minute (60000 ms)
setInterval(fetchData, 60000);

// Initial fetch on page load
fetchData();

</script>

    </div>

</body>
</html>
